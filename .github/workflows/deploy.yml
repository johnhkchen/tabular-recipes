name: Deploy

# Builds the recipes into a static site and publishes it to GitHub Pages.
# Enable it once under Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The project page URL. For a custom domain, set these to the domain and "/",
      # and add public/CNAME.
      SITE_URL: https://johnhkchen.github.io
      SITE_BASE: /tabular-recipes
    steps:
      - uses: actions/checkout@v7

      # Node 24: the build scripts import src/lib/*.ts directly, which needs a Node
      # that strips types without a flag.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Parses every .cook file, refuses the ones that would not draw a table, runs the
      # layout tests, then builds. A broken recipe fails here, not in front of a reader.
      - run: npm run verify

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
